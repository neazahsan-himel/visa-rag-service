# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=visa-rag-service
# 8080 is claimed by a local Docker Desktop Kubernetes cluster on this machine
server.port=8081

# ── Datasource ────────────────────────────────────────────────────────────────
# Override with env vars SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD in Docker
spring.datasource.url=jdbc:postgresql://localhost:5433/visa_rag
spring.datasource.username=visa_user
spring.datasource.password=visa_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
# Flyway owns the schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Qdrant ────────────────────────────────────────────────────────────────────
# Override with env vars QDRANT_HOST / QDRANT_PORT in Docker
qdrant.host=localhost
qdrant.port=6334

# ── Spring AI — provider selection ─────────────────────────────────────────────
# openai (default) | ollama — switch with SPRING_PROFILES_ACTIVE=ollama, see
# application-ollama.properties. Never both at once (ambiguous ChatModel bean).
spring.ai.model.chat=openai
spring.ai.model.embedding=openai

# ── Spring AI — OpenAI ────────────────────────────────────────────────────────
# Set OPENAI_API_KEY env var before running
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.1

# ── RAG ───────────────────────────────────────────────────────────────────────
rag.chunking.size=512
rag.chunking.overlap=64
rag.retrieval.top-k=20
rag.confidence.threshold=0.60
# Must match the active embedding model's output dimension (see application-ollama.properties)
rag.embedding.dimension=1536

# ── Knowledge base ────────────────────────────────────────────────────────────
# Root directory FileSystemDocumentLoader resolves ingestion paths against
knowledge-base.root=knowledge-base

# ── Source change monitoring ──────────────────────────────────────────────────
# HTTP timeout UrlDocumentLoader waits before treating a source as unreachable
source-monitoring.fetch-timeout-seconds=10
# Delay between the end of one SourceChangeMonitor run and the start of the next
source-monitoring.check-interval-ms=86400000

# ── OCR (Tesseract, self-hosted) ────────────────────────────────────────────────
# Path to Tesseract's trained-data directory; override with env var TESSDATA_PATH.
# Default matches the tesseract-ocr Alpine package layout the app's own Dockerfile installs.
# Local (non-Docker) runs must set TESSDATA_PATH themselves, e.g. the Windows
# Tesseract-OCR installer's tessdata folder.
ocr.tesseract.data-path=${TESSDATA_PATH:/usr/share/tessdata}
ocr.tesseract.language=eng

# ── Applicant documents ──────────────────────────────────────────────────────────
# Root directory FileSystemApplicantDocumentStore writes uploaded images under
applicant-documents.storage-root=applicant-documents

# Spring Boot defaults (1MB/10MB) are too small for a real phone-camera passport
# photo; raised for the vision-preview diagnostic upload endpoint.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB