# ── Spring AI — Ollama (local LLM) ──────────────────────────────────────────
# Activate with SPRING_PROFILES_ACTIVE=ollama. Requires a running local Ollama
# instance (default http://localhost:11434) with both models pulled:
#   ollama pull gemma4:latest
#   ollama pull nomic-embed-text
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4:latest
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ── Qdrant collection ────────────────────────────────────────────────────────
# nomic-embed-text produces 768-dim vectors (vs. OpenAI text-embedding-3-small's 1536)
rag.embedding.dimension=768
