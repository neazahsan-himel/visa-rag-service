# ── Spring AI — Ollama (local LLM) ──────────────────────────────────────────
# Activate with SPRING_PROFILES_ACTIVE=ollama. Requires a running local Ollama
# instance (default http://localhost:11434) with both models pulled:
#   ollama pull qwen2.5vl:7b
#   ollama pull nomic-embed-text
#
# qwen2.5vl:7b (not llava:7b or gemma4:latest) — llava:7b consumes image input
# but was found (2026-09-02 passport-extraction testing) to hallucinate
# confident-looking wrong values for fine-grained fields like passport
# numbers and dates rather than reading them correctly. gemma4:latest claims
# vision support in its own capability metadata but was verified live
# (through this adapter and raw Ollama API calls) to ignore the image
# entirely. Used for both RAG text queries and VisionPassportExtractionAdapter's
# passport-image extraction — one model, one profile, no separate vision
# provider/config.
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5vl:7b
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ── Qdrant collection ────────────────────────────────────────────────────────
# nomic-embed-text produces 768-dim vectors (vs. OpenAI text-embedding-3-small's 1536)
rag.embedding.dimension=768
