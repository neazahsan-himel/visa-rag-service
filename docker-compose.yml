services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: visa_rag
      POSTGRES_USER: visa_user
      POSTGRES_PASSWORD: visa_password
    ports:
      # host 5433, not 5432 — a native Windows Postgres service already owns 5432 on this machine
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visa_user -d visa_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant image has no wget/curl; use bash's /dev/tcp for a plain TCP check
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data: